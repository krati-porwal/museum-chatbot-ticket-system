{% extends "base.html" %}

{% block title %}Login - MuseumHub{% endblock %}

{% block content %}
<div class="auth-container" style="background: linear-gradient(120deg, #667eea 0%, #f093fb 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    <div class="auth-box" style="background: rgba(255,255,255,0.15); box-shadow: 0 8px 32px rgba(118,75,162,0.15); border-radius: 24px; padding: 0; max-width: 450px; width: 100%;">
        <div class="auth-content" style="padding: 2.5em; color: #222;">
            <div class="auth-header" style="text-align: center; margin-bottom: 2em;">
                <div class="auth-icon" style="font-size: 3em; color: #764ba2; margin-bottom: 0.5em;">
                    <i class="fas fa-user-circle"></i>
                </div>
                <h2 style="font-size: 2em; font-weight: 700; color: #764ba2;">Welcome Back</h2>
                <p style="color: #667eea;">Sign in to your MuseumHub account</p>
            </div>
            <form method="post" class="auth-form">
                <div class="form-group">
                    <div class="input-wrapper" style="margin-bottom: 1.5em;">
                        <i class="fas fa-user input-icon" style="color: #764ba2;"></i>
                        <input type="text" id="username" name="username" class="form-input" placeholder="Username" required style="background: #f5f5fa; color: #222; border: 1px solid #764ba2; border-radius: 12px; padding: 1em 1em 1em 3em;">
                        <div class="input-line"></div>
                    </div>
                </div>
                <div class="form-group">
                    <div class="input-wrapper" style="margin-bottom: 1.5em;">
                        <i class="fas fa-lock input-icon" style="color: #764ba2;"></i>
                        <input type="password" id="password" name="password" class="form-input" placeholder="Password" required style="background: #f5f5fa; color: #222; border: 1px solid #764ba2; border-radius: 12px; padding: 1em 1em 1em 3em;">
                        <div class="input-line"></div>
                    </div>
                </div>
                <div class="form-options" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2em; font-size: 0.95em;">
                    <label class="checkbox-wrapper" style="display: flex; align-items: center;">
                        <input type="checkbox" id="remember">
                        <span class="checkmark"></span>
                        <span style="margin-left: 0.5em; color: #764ba2;">Remember me</span>
                    </label>
                    <a href="#" class="forgot-link" style="color: #f093fb;">Forgot Password?</a>
                </div>
                <button type="submit" class="auth-btn primary" style="background: linear-gradient(90deg, #764ba2 0%, #f093fb 100%); color: #fff; font-weight: 600; font-size: 1.1em; padding: 0.8em 2em; border-radius: 30px; box-shadow: 0 4px 16px rgba(118,75,162,0.15); width: 100%;">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
            <div class="social-login" style="margin-top: 2em; text-align: center;">
                <p style="color: #667eea;">Or continue with</p>
                <div class="social-buttons" style="display: flex; gap: 1em; justify-content: center;">
                    <button class="social-btn google" style="background: #fff; color: #764ba2; border: 1px solid #764ba2; border-radius: 18px; padding: 0.6em 1.2em; font-weight: 600; box-shadow: 0 2px 8px rgba(118,75,162,0.08);">
                        <i class="fab fa-google"></i>
                        <span>Google</span>
                    </button>
                    <button class="social-btn facebook" style="background: #fff; color: #667eea; border: 1px solid #667eea; border-radius: 18px; padding: 0.6em 1.2em; font-weight: 600; box-shadow: 0 2px 8px rgba(118,75,162,0.08);">
                        <i class="fab fa-facebook-f"></i>
                        <span>Facebook</span>
                    </button>
                </div>
            </div>
            <div class="auth-footer" style="margin-top: 2em; text-align: center;">
                <p style="color: #222;">Don't have an account? <a href="{{ url_for('register') }}" class="link-highlight" style="color: #764ba2; font-weight: 600;">Sign up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
